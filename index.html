<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Runs before the page is drawn, so a saved dark theme doesn't flash
       white first. Modules run later, which would be too late for this. -->
  <script>
    try {
      const saved = localStorage.getItem("calculator:theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="calculator__header">
      <h1 class="calculator__title">Calculator</h1>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="Switch to dark theme">🌙</button>
    </header>

    <!-- The screen: what you've typed, and the answer underneath -->
    <section class="display" aria-label="Display">
      <p id="expression" class="display__expression">0</p>
      <!-- <output> is the HTML element meant for the result of a calculation -->
      <output id="result" class="display__result"></output>
    </section>

    <!-- Screen readers read this out when it changes. It's separate from the
         display so they hear the answer on "=", not a preview on every key. -->
    <p id="announcer" class="visually-hidden" aria-live="polite"></p>

    <!-- The keypad. Each button says what it does with a data- attribute:
         data-value  = a character to type ("7", "+", "(")
         data-action = a command ("clear", "equals")
         The maths uses * / - while the buttons show × ÷ −. -->
    <div id="keypad" class="keypad">
      <button type="button" class="key key--function" data-action="clear" aria-label="Clear all">AC</button>
      <button type="button" class="key key--function" data-action="backspace" aria-label="Delete last">⌫</button>
      <button type="button" class="key key--function" data-action="percent" aria-label="Percent">%</button>
      <button type="button" class="key key--operator" data-value="/" aria-label="Divide">÷</button>

      <button type="button" class="key key--function" data-value="(" aria-label="Open bracket">(</button>
      <button type="button" class="key key--function" data-value=")" aria-label="Close bracket">)</button>
      <button type="button" class="key key--function" data-action="negate" aria-label="Plus or minus">±</button>
      <button type="button" class="key key--operator" data-value="*" aria-label="Multiply">×</button>

      <button type="button" class="key" data-value="7">7</button>
      <button type="button" class="key" data-value="8">8</button>
      <button type="button" class="key" data-value="9">9</button>
      <button type="button" class="key key--operator" data-value="-" aria-label="Minus">−</button>

      <button type="button" class="key" data-value="4">4</button>
      <button type="button" class="key" data-value="5">5</button>
      <button type="button" class="key" data-value="6">6</button>
      <button type="button" class="key key--operator" data-value="+" aria-label="Plus">+</button>

      <button type="button" class="key" data-value="1">1</button>
      <button type="button" class="key" data-value="2">2</button>
      <button type="button" class="key" data-value="3">3</button>
      <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>

      <button type="button" class="key key--zero" data-value="0">0</button>
      <button type="button" class="key" data-value="." aria-label="Decimal point">.</button>
    </div>
  </main>
</body>
</html>
